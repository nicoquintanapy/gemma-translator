name: Deploy web translator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Requires a one-time repository setting:
      #   Settings → Pages → Build and deployment → Source: "GitHub Actions".
      # The action can also create the Pages site itself via `enablement: true`,
      # but the default GITHUB_TOKEN is not allowed to do that ("Resource not
      # accessible by integration"), so the setting has to be flipped by hand.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        # Project pages are served from /<repo>/, so the bundle must be built
        # against that prefix. configure-pages reports "" for custom domains
        # and user pages, which yields a plain "/".
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
